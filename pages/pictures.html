<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Butiken har flyttat | Vaavascanvas</title>

  <!-- The shop used to live here. It now sits at /pictures/, alongside a page
       for each work (/pictures/kattuggla.html and so on), so the listing and
       the things it lists share one address space.

       This file stays behind so links and bookmarks people already have keep
       working. It points search engines at the new address with a canonical
       tag and keeps itself out of the index; visitors are moved on by the
       refresh below, with the link as a fallback. -->
  <link rel="canonical" href="https://vaavascanvas.se/pictures/" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=/pictures/" />

  <link rel="icon" type="image/png" href="../images/logo.png" />
</head>

<body>
  <p style="font-family: sans-serif; text-align: center; padding: 2rem;">
    Butiken finns nu på <a href="/pictures/">vaavascanvas.se/pictures/</a>.
  </p>

  <script>
    // Replace rather than assign, so Back does not bounce off this page
    window.location.replace("/pictures/" + window.location.search + window.location.hash);
  </script>
</body>

</html>
